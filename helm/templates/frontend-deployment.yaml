apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "Chart.fullname" .}}-frontend
  labels:
    app: {{include "Chart.fullname" .}}-frontend-app
spec:
  replicas: {{.Values.replicaCount.frontend}}
  selector:
    matchLabels:
      app: {{include "Chart.fullname" .}}-frontend-app
  template:
    metadata:
      labels:
        app: {{include "Chart.fullname" .}}-frontend-app
    spec:
      containers:
        - name: {{include "Chart.fullname" .}}-frontend-app
          image: "{{.Values.image.frontend.repository}}:{{.Values.image.frontend.tag}}"
          ports:
            - containerPort: 3000
          env: 
            - name: API_ORIGIN
              value: "http://{{include "Chart.fullname" .}}-backend:80"
