apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{include "Chart.fullname" .}}-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  rules:
    - host: {{.Values.host}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{include "Chart.fullname" .}}-frontend
                port:
                    number: 80
