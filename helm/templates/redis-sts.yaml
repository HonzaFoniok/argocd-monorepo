apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: {{include "Chart.fullname" .}}-redis
spec: 
  replicas: 1
  serviceName: {{include "Chart.fullname" .}}-redis
  template:
    metadata:
      labels: 
        app: {{include "Chart.fullname" .}}-redis
    spec:
      containers:
        - name: redis
          image: redis
          ports:
            - containerPort: 6379
          volumeMounts:
            - mountPath: /data
              name: data
  selector: 
    matchLabels: 
      app: {{include "Chart.fullname" .}}-redis
  volumeClaimTemplates:
    - metadata:
        name: data
      spec: 
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
